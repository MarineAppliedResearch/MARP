# MARP component registry.
#
# Two categories, because they are consumed differently:
#
#   components  - part of a MARP deployment. These are what an installer offers
#                 and what a running MARP system consists of.
#   related     - NOT part of a MARP deployment. Present in the workspace so
#                 they can be developed and kept in sync with the components
#                 they talk to. An installer must never offer these.
#
# Every field is verified against the actual repositories, not aspirational.
#
# Fields:
#   repository      - GitHub repository, or null if it does not exist yet
#   directory       - clone location relative to this umbrella repository root
#   default_branch  - the branch a fresh clone lands on
#   visibility      - public | private. Private repositories need credentials
#                     before scripts/marp can clone them.
#   role            - what it does
#   runtime         - what must be installed to build or run it
#   platforms       - operating systems it can run on
#   status          - active | undecided
#   notes           - anything a developer or installer needs to know
#
# Keep the /directory entries in sync with the umbrella .gitignore.
#
# THIS FILE IS READ BY SCRIPTS. `scripts/marp.ps1` and `scripts/marp.sh` parse
# it without a YAML library, so the shape is constrained rather than free:
# group keys at column 0, one repository key indented two spaces, and its
# fields indented four. Folded values (`notes: >`) may run on at six spaces or
# more. `scripts/marp doctor` fails if a registry entry cannot be read, which
# is the check that this stays true.


# ---------------------------------------------------------------------------
# Components: the MARP system itself
# ---------------------------------------------------------------------------
components:
  marp-api:
    repository: MarineAppliedResearch/MARP_API
    directory: MARP_API
    default_branch: master
    visibility: public
    role: MARP API and application backend
    runtime: Node 22 (pinned in .nvmrc), PostgreSQL
    platforms: [linux, windows, macos]
    status: active
    planned_name: marp-api
    notes: >
      Also serves the MARP browser applications from frontend/apps (video
      player, landing page, dashboards). Splitting the frontend out is a
      possible future change, not current scope. With PostgreSQL, this is the
      smallest useful MARP install.

      Renamed from MARE_API. GitHub still redirects the old name, so a stale
      reference appears to work and will stop working the moment anyone
      creates a new repository called MARE_API. Always use MARP_API.

  marp-video-server:
    repository: MarineAppliedResearch/marp-jellyfin
    directory: marp-jellyfin
    default_branch: master
    visibility: public
    role: Video service backend, forked from Jellyfin
    runtime: .NET SDK (pinned in global.json)
    platforms: [linux, windows, macos]
    status: active
    planned_name: marp-video-server
    notes: >
      Full Jellyfin fork, roughly 93 MB checked out. Inherits Jellyfin's own
      deployment/ directory, so it is the only component with an existing
      container build path.

  marp-inference-worker:
    repository: MarineAppliedResearch/marp-inference-worker
    directory: marp-inference-worker
    default_branch: master
    visibility: public
    role: Machine-learning inference service
    runtime: Python >= 3.10, ultralytics, NVIDIA GPU
    platforms: [linux, windows]
    status: active
    notes: >
      Vendors ByteTrack as a subdirectory. Requires an NVIDIA GPU to run,
      though not to build, which makes it the least portable component to
      deploy. Optional in a MARP install.

  marp-video-player:
    repository: MarineAppliedResearch/marp-video-player
    directory: marp-video-player
    default_branch: master
    visibility: public
    role: Reusable JavaScript/WebCodecs video player
    runtime: Node 20+
    platforms: [linux, windows, macos]
    status: active
    notes: >
      Extracted from marp-api on 2026-08-31; pre-extraction history remains
      there. Builds to three self-contained bundles: ESM for import, IIFE for
      a plain script tag, and a minified single-file build for native hosts.
      No runtime dependencies and no network requests at load, so it works
      offline. The IIFE global is MarpVideoEngine, which the C# WebView2 host
      in video-processing-gui depends on.

      Deliberately not consumed by marp-api: the two are disconnected.


# ---------------------------------------------------------------------------
# Related: developed alongside MARP, but not part of a MARP deployment
# ---------------------------------------------------------------------------
related:
  video-processing-gui:
    repository: MarineAppliedResearch/VIDEO_PROCESSING_GUI
    directory: VIDEO_PROCESSING_GUI
    default_branch: develop
    visibility: private
    role: Desktop annotation and review client
    runtime: .NET Framework 4.7.2, WPF
    platforms: [windows]
    status: active
    notes: >
      Legacy application, and deliberately NOT part of the final MARP system.
      It is in this workspace because it consumes the MARP API and must be
      updated when that API changes, so developers need it checked out and
      buildable alongside the components.

      Windows-only and permanently so: .NET Framework 4.7.2 predates .NET
      Core, so it cannot run on Linux or in a container. Any cross-platform
      tooling must skip it rather than try to accommodate it.

      The only private repository in the registry, so cloning it needs
      credentials that the public components do not.
